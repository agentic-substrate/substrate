<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 346" width="820" height="346" role="img" aria-labelledby="t d">
  <title id="t">Substrate</title>
  <desc id="d">Disposable harnesses on top, one durable control plane beneath, every machine in sync.</desc>
  <defs>
    <style>
      .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .cap { font-size: 10.5px; letter-spacing: 1.6px; fill: #94a3b8; }
      .name { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 11.5px; fill: #64748b; }
      .slab-name { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; fill: #f8fafc; }
      .slab-sub { font-size: 12.5px; fill: #94a3b8; }
      .chain { font-size: 10.5px; fill: #7dd3fc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0.5 L7 4 L0 7.5 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <g class="f">
    <text class="cap" x="40" y="16">HARNESSES · DISPOSABLE</text>

    <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4" fill="#f8fafc">
      <rect x="40"  y="26" width="200" height="56" rx="10"/>
      <rect x="310" y="26" width="200" height="56" rx="10"/>
      <rect x="580" y="26" width="200" height="56" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text class="name" x="140" y="50">Claude Code</text><text class="sub" x="140" y="68">CLAUDE.md</text>
      <text class="name" x="410" y="50">Codex</text><text class="sub" x="410" y="68">AGENTS.md</text>
      <text class="name" x="680" y="50">Cursor</text><text class="sub" x="680" y="68">~/.cursor/rules</text>
    </g>

    <g stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#a)">
      <path d="M140 84 V124"/><path d="M410 84 V124"/><path d="M680 84 V124"/>
    </g>

    <rect x="40" y="132" width="740" height="86" rx="12" fill="#0f172a"/>
    <rect x="40" y="132" width="740" height="86" rx="12" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <text class="slab-name" x="66" y="170">SUBSTRATE</text>
    <text class="slab-sub" x="66" y="194">one durable control plane · instructions · memory · skills</text>
    <text class="chain" x="754" y="170" text-anchor="end">global → org → team → project → repo</text>
    <text class="chain" x="754" y="194" text-anchor="end">→ branch → task → session</text>

    <g stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#a)">
      <path d="M140 220 V262"/><path d="M410 220 V262"/><path d="M680 220 V262"/>
    </g>

    <g stroke="#cbd5e1" stroke-width="1.5" fill="#ffffff">
      <rect x="40"  y="270" width="200" height="56" rx="10"/>
      <rect x="310" y="270" width="200" height="56" rx="10"/>
      <rect x="580" y="270" width="200" height="56" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text class="name" x="140" y="294">laptop</text><text class="sub" x="140" y="312">in sync</text>
      <text class="name" x="410" y="294">homelab server</text><text class="sub" x="410" y="312">in sync</text>
      <text class="name" x="680" y="294">GPU box</text><text class="sub" x="680" y="312">in sync</text>
    </g>
    <text class="cap" x="40" y="342">MACHINES · ONE AUTHORITATIVE CONTEXT</text>
  </g>
</svg>
