<rect x="492" y="132" width="202" height="70" rx="12" fill="#131f31" stroke="#33465f"/><text x="510" y="161" class="label">Cursor</text><text x="510" y="184" class="body">Desktop</text>
<rect x="718" y="132" width="202" height="70" rx="12" fill="#131f31" stroke="#33465f"/><text x="736" y="161" class="label">MCP client</text><text x="736" y="184" class="body">Headless worker</text>
