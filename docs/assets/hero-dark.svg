<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Substrate — context that outlives the session</title>
<desc id="desc">Coding harnesses on laptops, workstations, and workers sit above Substrate. Blue arrows deliver scoped context and approved skills upward. Green arrows return observations and proposals through provenance and review. The durable layer holds instructions, preferences, memories, and skill state, with Postgres for context and state and Git for skill content. Checkpoints, knowledge maintenance, and skill proposals extend this foundation in the long-term vision.</desc>
<defs>
 <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8acaff" stroke-width="1.6"/></marker>
 <marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8ee0c0" stroke-width="1.6"/></marker>
 <style>text {font-family:DejaVu Sans,Arial,sans-serif} .title {font-size:29px;font-weight:700;fill:#f1f5fa} .label {font-size:15px;font-weight:700;fill:#f1f5fa} .body {font-size:13px;fill:#b0bfd2} .eyebrow {font-size:11px;letter-spacing:2px;font-weight:700;fill:#8acaff}</style>
</defs>
