<text x="859" y="262" text-anchor="end" class="body">Provenance · status · review</text>
<rect x="40" y="289" width="880" height="207" rx="16" fill="#142e49" stroke="#8acaff"/>
<text x="64" y="328" class="title">Substrate</text>
<text x="896" y="326" text-anchor="end" class="body">SELF-HOSTED CONTEXT LAYER</text>
<rect x="64" y="350" width="199" height="76" rx="10" fill="#131f31"/><text x="78" y="379" class="label">Instructions</text><text x="78" y="404" class="body">Deterministic rules</text>
