name: Feature / epic
description: A capability to build. Check docs/product/non-goals.md first.
labels: ["type:feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Phrased so it is testable by using the system, not by reading the diff.
    validations: {required: true}
  - type: textarea
    id: baseline
    attributes:
      label: Baseline
      description: >
        What you actually read, with file:line anchors and requirement IDs. This stops both the
        author and any dispatched worker from inventing.
    validations: {required: true}
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: >
        Verified traps that fail silently. Cite AGENTS.md gotchas by number. These get copied
        verbatim into any worker's brief.
    validations: {required: true}
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Given / when / then. One per line.
    validations: {required: true}
  - type: textarea
    id: outofscope
    attributes:
      label: Out of scope
      description: Unbounded scope is the default failure of agent-built features. Be explicit.
