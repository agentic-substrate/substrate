name: Bug report
description: Report reproducible behavior that violates an implemented contract.
type: Bug
body:
  - type: markdown
    attributes:
      value: Report security issues privately using SECURITY.md. Do not include private artifacts or credentials.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the boundary that failed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the revision, Linux or WSL environment, commands, and synthetic inputs.
    validations:
      required: true
