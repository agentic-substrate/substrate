name: Bug report
description: Something behaves differently from what the docs or requirements say.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
      description: If a requirement ID covers it (SCOPE-1, MEM-7, ...), name it.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest sequence that shows it. Exact commands, exact output.
      render: shell
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `substrate-server -h` build info, or the commit SHA.
    validations: {required: true}
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Go version, and which harness/machine — WSL, macOS, or a pod.
