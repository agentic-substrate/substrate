name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new query pack finds old code even when nothing is changing.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@fddeee1a7ece751b577e409a89057319e3172939 # v4
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
