# Rate limit for /mcp.
#
# Known limitation, accepted for Phase 1: sourceCriterion.requestHeaderName
# buckets by the *value* of Authorization, so every request that arrives
# WITHOUT that header shares one bucket keyed on the empty value. This is
# per-token for authenticated traffic (the case that matters) but means an
# unauthenticated flood can consume the shared bucket and 429 legitimate
# pre-auth requests. Acceptable because the entrypoint is tailnet-only —
# reaching this middleware at all already requires being on the tailnet — and
# because the alternative (ipStrategy) is worse here: every request arrives
# from the Tailscale proxy, so all callers would collapse into one bucket.
# Revisit if /mcp is ever exposed beyond the tailnet.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-per-token-ratelimit
  namespace: substrate
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 30
    sourceCriterion:
      requestHeaderName: Authorization
