apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: substrate
namespace: substrate
resources:
  - namespace.yaml
  - cnpg/cluster.yaml
  - cnpg/scheduled-backup.yaml
  - cnpg/superuser-secret.yaml
  - server/deployment.yaml
  - server/service.yaml
  - server/configmap.yaml
  - server/secret.yaml
  - ingress/middleware.yaml
  - ingress/certificate.yaml
  - ingress/ingressroute.yaml
  - restore/cronjob.yaml
  - restore/rbac.yaml
configMapGenerator:
  - name: substrate-restore
    files:
      - restore-test.sh=restore/restore-test.sh
      - restore-assert.sh=restore/restore-assert.sh
      - scratch-cluster.yaml=cnpg/scratch-cluster.yaml
generatorOptions:
  disableNameSuffixHash: true
