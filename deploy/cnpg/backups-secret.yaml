# TEMPLATE. Named keys, empty values. Fill on the operator machine.
#
# Split out of the server's secret on purpose: these keys grant read/write on
# the `substrate-backups` bucket, and only CNPG (barman-cloud, in the Postgres
# pod) needs them. Injecting them into substrate-server's environment would
# mean any RCE in the app leaks the backups.
apiVersion: v1
kind: Secret
metadata:
  name: substrate-backups-s3
  namespace: substrate
type: Opaque
stringData:
  ACCESS_KEY_ID: ""
  ACCESS_SECRET_KEY: ""
