apiVersion: v1
kind: ServiceAccount
metadata:
  name: substrate-restore
  namespace: substrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: substrate-restore
  namespace: substrate
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: substrate-restore
  namespace: substrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: substrate-restore
subjects:
  - kind: ServiceAccount
    name: substrate-restore
    namespace: substrate
