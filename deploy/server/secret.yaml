# TEMPLATE. Named keys, empty values. Fill on the operator machine.
# Never commit a token, a DSN password, a MinIO key, or a tailnet name.
#
# This holds ONLY what cmd/substrate-server actually reads. The MinIO backup
# credentials are deliberately NOT here — see deploy/cnpg/backups-secret.yaml.
#
# SUBSTRATE_DSN must use the CNPG-generated application role, never `postgres`.
# CNPG creates the secret `substrate-pg-app` (user `app`, the initdb owner) with
# a generated password; read it, do not invent one:
#   kubectl get secret substrate-pg-app -n substrate -o jsonpath='{.data.uri}' | base64 -d
# The two `managed.roles` (substrate_migrate, substrate_app) are `login: false`
# and have no passwordSecret — they are SET ROLE targets, not connection
# identities, and cannot appear in a DSN.
apiVersion: v1
kind: Secret
metadata:
  name: substrate-server
  namespace: substrate
type: Opaque
stringData:
  SUBSTRATE_DSN: ""
